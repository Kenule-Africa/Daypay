name: deypay-dev
services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: deypay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local bootstrap password}
      DEYPAY_DB_PASSWORD: ${DEYPAY_DB_PASSWORD:?Set a separate local application password}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/bootstrap.psql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
      - ./infrastructure/postgres/verify.psql:/opt/deypay/verify.psql:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$DEYPAY_DB_PASSWORD\" psql -X -h 127.0.0.1 -U deypay_app -d deypay -v ON_ERROR_STOP=1 -Atqc 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  pgdata:
