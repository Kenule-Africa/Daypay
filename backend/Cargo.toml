[workspace]
members = [
    "crates/deypay-domain",
    "crates/deypay-application",
    "crates/deypay-infrastructure",
    "crates/deypay-common",
    "crates/deypay-api",
    "crates/deypay-worker",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
