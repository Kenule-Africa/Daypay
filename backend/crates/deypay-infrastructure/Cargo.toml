[package]
name = "deypay-infrastructure"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "PostgreSQL repositories and external provider adapters."

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
hmac = "0.12"
hex = "0.4"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
argon2 = { version = "0.5.3", features = ["zeroize"] }
getrandom = "0.2"
zeroize = "1"
sha2.workspace = true
uuid.workspace = true
deypay-application = { path = "../deypay-application" }
deypay-domain = { path = "../deypay-domain" }
deypay-common = { path = "../deypay-common" }
sqlx = { workspace = true, features = ["macros", "migrate", "uuid", "json"] }
tokio = { workspace = true, features = ["sync"] }

[features]
postgres-tests = []

[[test]]
name = "persistence"
required-features = ["postgres-tests"]

[[test]]
name = "registration"
required-features = ["postgres-tests"]
