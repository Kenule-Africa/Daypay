<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset your password · DEYPAY</title><script src="/reset-password.js" defer></script></head>
<body><main><h1>Choose a new DEYPAY password</h1><p>Resetting your password signs you out on every device.</p>
<form id="reset" novalidate>
<p><label for="password">New password</label><br><input id="password" type="password" autocomplete="new-password" required disabled></p>
<p><label for="confirm">Confirm new password</label><br><input id="confirm" type="password" autocomplete="new-password" required disabled></p>
<button type="submit" id="submit" disabled>Reset password</button>
</form><p role="status" id="status"></p><noscript>Enable JavaScript to reset your password.</noscript>
</main></body></html>
