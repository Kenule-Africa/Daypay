[package]
name = "deypay-api"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "HTTP entry point for the DEYPAY API."

[lints]
workspace = true

[dependencies]
zeroize = "1"
percent-encoding = "2"
serde.workspace = true
serde_json.workspace = true
deypay-application = { path = "../deypay-application" }
axum.workspace = true
deypay-common = { path = "../deypay-common" }
deypay-infrastructure = { path = "../deypay-infrastructure" }
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
sqlx = { workspace = true, features = ["macros", "migrate"] }

[features]
postgres-tests = []

[[test]]
name = "registration_http"
required-features = ["postgres-tests"]

[[test]]
name = "email_verification"
required-features = ["postgres-tests"]
